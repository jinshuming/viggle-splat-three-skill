<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Lobby 预览</title>
<style>
  html,body{margin:0;height:100%;background:#15161a;color:#eee;font:14px/1.4 -apple-system,"PingFang SC",sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#0008;padding:8px 10px;border-radius:10px;backdrop-filter:blur(6px)}
  button,select{background:#2a2c33;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  button.on{background:#3b6cf0;border-color:#3b6cf0}
  #refwrap{position:fixed;right:12px;top:12px;width:200px;background:#0008;padding:6px;border-radius:10px;display:flex;flex-direction:column;gap:6px}
  #refwrap video{width:100%;border-radius:6px;display:block;background:#000}
  #refwrap label{font-size:12px;color:#ccc;display:flex;gap:6px;align-items:center}
  #refwrap input[type=range]{flex:1}
  #status{position:fixed;left:12px;bottom:58px;color:#aaa}
  #bar{position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:#0008;padding:8px 12px;border-radius:10px}
  #bar input{flex:1;accent-color:#3b6cf0}
  #bar span{font-variant-numeric:tabular-nums;color:#ccc;min-width:210px;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span id="pairs"></span>
  <button id="play">暂停</button>
  <label>速度 <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option></select></label>
</div>
<div id="refwrap">
  <video id="ref" src="/reference.mp4" muted playsinline preload="auto"></video>
  <label>偏移 <input id="off" type="range" min="-3" max="5" step="0.05" value="0"><span id="offv">0.00s</span></label>
  <button id="snd">开启原声</button>
</div>
<div id="bar"><button id="play2">暂停</button><input id="tl" type="range" min="0" max="1" step="0.01" value="0"><span id="tt">0.00 / 0.00s</span></div>
<div id="status">加载中…</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
