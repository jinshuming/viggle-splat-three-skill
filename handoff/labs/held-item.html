<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Held Item Lab</title>
  <style>
    :root { --bg: #16161b; --panel: #000c; --line: #ffffff22; --acc: #ffb86b; --dim: #ffffff88; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; background: var(--panel); border-radius: 10px; backdrop-filter: blur(6px); }
    #left { top: 12px; left: 12px; padding: 10px 12px; width: 250px; }
    #left label.t { display: block; margin: 8px 0 3px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    #left label.t:first-child { margin-top: 0; }
    select { display: block; width: 100%; padding: 4px; background: #222; color: #eee; border: 1px solid var(--line); border-radius: 5px; }
    .slot { display: grid; grid-template-columns: 74px 1fr; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
    .slot.sel { border-color: var(--acc); background: #ffffff10; }
    .slot span { color: #ccc; }
    #views { display: flex; flex-wrap: wrap; gap: 5px; }
    button { background: #26262e; color: #ddd; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--acc); color: #fff; }
    #status { margin-top: 8px; color: var(--dim); font-size: 12px; min-height: 1.3em; }
    #right { top: 12px; right: 12px; bottom: 12px; width: 340px; padding: 10px 14px; overflow-y: auto; }
    #right h4 { margin: 14px 0 6px; color: var(--acc); font: 600 11px system-ui; text-transform: uppercase; letter-spacing: .06em; }
    #right h4:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 62px 1fr 54px; align-items: center; gap: 6px; line-height: 1.9; }
    .row .v { text-align: right; font: 11px ui-monospace, Menlo, monospace; color: #fff; }
    input[type=range] { width: 100%; accent-color: var(--acc); margin: 0; }
    .mir { display: flex; gap: 14px; margin-top: 4px; }
    textarea { width: 100%; box-sizing: border-box; height: 190px; background: #0b0b0f; color: #fec; border: 1px solid var(--line); border-radius: 6px; font: 11px ui-monospace, Menlo, monospace; padding: 6px; resize: vertical; }
    textarea.bad { border-color: #f66; }
    .btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    #note { color: #fc6; font-size: 11px; min-height: 1em; margin-top: 4px; }
    #hint { position: fixed; bottom: 10px; left: 12px; color: var(--dim); font-size: 11px; }
    @media (max-width: 760px) { #right { top: auto; height: 46vh; width: auto; left: 8px; right: 8px; bottom: 8px; } #left { width: 190px; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="left" class="panel">
    <label class="t">Character <select id="charSel"></select></label>
    <label class="t">Motion <select id="clipSel"></select></label>
    <label class="t">Sockets (click to edit its fit)</label>
    <div id="slots"></div>
    <label class="t">Camera</label>
    <div id="views"></div>
    <div id="status">Loading…</div>
  </div>
  <div id="right" class="panel">
    <h4>Fit: <span id="fitName">-</span></h4>
    <div id="fitCtl"></div>
    <div class="mir"><label><input type="checkbox" data-m="x"> mirror x</label><label><input type="checkbox" data-m="y"> mirror y</label><label><input type="checkbox" data-m="z"> mirror z</label></div>
    <div id="note"></div>
    <h4>Item JSON <span style="color:var(--dim);font-weight:400;text-transform:none">(two-way: edit to apply)</span></h4>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="btns">
      <button id="copy">Copy item JSON</button>
      <button id="copyAll">Copy all items</button>
      <button id="resetFit">Reset fit</button>
      <button id="snap">Screenshot</button>
    </div>
  </div>
  <div id="hint">drag = orbit · wheel = zoom · agents: <code>window.heldItemLab</code></div>
  <script type="module" src="/src/held-item-demo.js"></script>
</body>
</html>
