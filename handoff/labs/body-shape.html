<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Shape Lab</title>
  <style>
    :root { --bg: #16161b; --panel: #000c; --line: #ffffff22; --acc: #7cc4ff; --dim: #ffffff88; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; background: var(--panel); border-radius: 10px; backdrop-filter: blur(6px); }
    #left { top: 12px; left: 12px; padding: 10px 12px; width: 230px; }
    #left label { display: block; margin-bottom: 8px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    #left select { display: block; width: 100%; margin-top: 3px; padding: 4px; background: #222; color: #eee; border: 1px solid var(--line); border-radius: 5px; }
    #presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    button { background: #26262e; color: #ddd; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--acc); color: #fff; }
    #status { margin-top: 8px; color: var(--dim); font-size: 12px; min-height: 1.3em; }
    #right { top: 12px; right: 12px; bottom: 12px; width: 330px; padding: 10px 14px; overflow-y: auto; }
    #right h4 { margin: 14px 0 6px; color: var(--acc); font: 600 11px system-ui; text-transform: uppercase; letter-spacing: .06em; }
    #right h4:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 108px 1fr 42px; align-items: center; gap: 6px; line-height: 1.9; }
    .row span.v { text-align: right; font: 11px ui-monospace, Menlo, monospace; color: #fff; }
    .row.changed span.v { color: var(--acc); }
    input[type=range] { width: 100%; accent-color: var(--acc); margin: 0; }
    textarea { width: 100%; box-sizing: border-box; height: 120px; background: #0b0b0f; color: #cfe; border: 1px solid var(--line); border-radius: 6px; font: 11px ui-monospace, Menlo, monospace; padding: 6px; resize: vertical; }
    textarea.bad { border-color: #f66; }
    .btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    #warn { color: #fc6; font-size: 11px; margin-top: 4px; min-height: 1em; }
    #hint { position: fixed; bottom: 10px; left: 12px; color: var(--dim); font-size: 11px; }
    @media (max-width: 760px) { #right { top: auto; height: 46vh; width: auto; left: 8px; right: 8px; bottom: 8px; } #left { width: 170px; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="left" class="panel">
    <label>Character <select id="charSel"></select></label>
    <label>Motion <select id="clipSel"></select></label>
    <label>Presets <div id="presets"></div></label>
    <div id="status">Loading…</div>
  </div>
  <div id="right" class="panel">
    <h4>Proportions</h4><div id="specCtl"></div>
    <h4>Asymmetry / per limb</h4><div id="boneCtl"></div>
    <h4>Shape JSON <span style="color:var(--dim);font-weight:400;text-transform:none">(two-way: edit to apply)</span></h4>
    <textarea id="json" spellcheck="false"></textarea>
    <div id="warn"></div>
    <div class="btns">
      <button id="copy">Copy JSON</button>
      <button id="link">Copy share link</button>
      <button id="reset">Reset</button>
      <button id="snap">Screenshot</button>
    </div>
  </div>
  <div id="hint">drag = orbit · wheel = zoom · agents: <code>window.bodyShapeLab</code></div>
  <script type="module" src="/src/body-shape-demo.js"></script>
</body>
</html>
